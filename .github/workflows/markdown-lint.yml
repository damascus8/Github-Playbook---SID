name: Markdown lint

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules" ".git" ".venv"
