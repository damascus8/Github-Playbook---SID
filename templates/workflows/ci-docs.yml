# Optional Markdown lint workflow for a documentation-heavy repository.
name: Docs CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "#node_modules" ".git"
